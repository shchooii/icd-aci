<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found</title>
<style>
:root { --bg: #f1f4f3; --ink: #17211f; --muted: #586764; --accent: #0b6a60; }
@media (prefers-color-scheme: dark) { :root { --bg: #111615; --ink: #e5ebe9; --muted: #9aa8a4; --accent: #56c7b7; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; line-height: 1.55; }
main { padding: 24px; text-align: center; }
h1 { font-size: 20px; margin: 0 0 6px; }
p { margin: 0; color: var(--muted); }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Page not found · 페이지를 찾을 수 없습니다</h1>
  <p><a href="/">Back to the examples · 예시 화면으로</a></p>
</main>
</body>
</html>
